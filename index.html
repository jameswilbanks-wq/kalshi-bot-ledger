<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kalshi City</title>
<style>:root{--bg:#0b0a2e;--ink:#cfe9ff;--dim:#7f8fc0;--cy:#5ff5d2;--pk:#ff5fb2;--g:#4dff9a;--r:#ff5468;--o:#5fd6ff;--u:#9a8cff;--panel:rgba(14,12,56,.82)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}#hud>*{pointer-events:auto}
header{position:absolute;top:0;left:0;padding:14px 16px 12px;background:linear-gradient(90deg,rgba(7,6,31,.85),rgba(7,6,31,0))}
h1{margin:0 0 8px;font-size:20px;letter-spacing:.14em;color:#9fd8ff;text-shadow:0 0 12px #4aa8ff}
.live{font-size:10px;margin-left:8px;padding:2px 7px;border:1px solid #3d4a9a;background:#12123f;color:var(--ink);letter-spacing:.1em;vertical-align:middle}
.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:5px;box-shadow:0 0 8px var(--g)}
.row{display:flex;gap:8px}
select,button{font:inherit;background:rgba(18,18,70,.85);color:var(--ink);border:1px solid #4a56b8;padding:7px 10px;letter-spacing:.08em;cursor:pointer}
select:hover,button:hover{border-color:var(--cy);box-shadow:0 0 10px rgba(95,245,210,.35)}
#stat{max-width:300px;position:absolute;top:14px;right:16px;text-align:right;color:#aab6e8;font-size:11px;letter-spacing:.06em;padding:8px 12px;background:rgba(10,9,44,.78);border:1px solid #2f3a86}
#stat b{color:var(--ink);font-size:13px}
#hint{position:absolute;bottom:64px;left:0;right:0;text-align:center;color:#d6e4ff;text-shadow:0 0 6px #000;font-size:11px;pointer-events:none}
#strip{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:6px;overflow-x:auto}
.day{flex:1 0 74px;border:1px solid #2f3a86;background:rgba(14,14,56,.7);padding:4px 6px;min-width:74px}
.day small{color:var(--dim);display:block}.day span{font-weight:700}
.day.pos span{color:var(--g)}.day.neg span{color:var(--r)}.day.nil span{color:#56609a}
#board-btn{position:absolute;right:16px;bottom:74px}
.w{background:var(--g)}.l{background:var(--r)}.o{background:var(--o)}.u{background:var(--u)}
#label{position:fixed;pointer-events:none;display:none;padding:6px 9px;border:1px solid #6a78d8;background:var(--panel);font-size:11px;white-space:nowrap;transform:translate(-50%,-110%)}
#label b{font-size:13px}
aside#panel{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);background:var(--panel);backdrop-filter:blur(8px);border-left:1px solid #4a56b8;padding:18px 16px;overflow:auto;z-index:5}
#close,#bclose{position:absolute;top:8px;right:10px;padding:2px 9px;font-size:16px}
aside h2,#board h2{margin:0 0 4px;font-size:15px;letter-spacing:.08em;color:#9fd8ff}
.tr{border:1px solid #2f3a86;margin:10px 0;padding:8px 10px;background:rgba(10,10,44,.6)}
.tr .t{display:flex;justify-content:space-between;gap:8px}.tr .n{color:var(--dim);margin-top:4px;font-size:11px}
.pill{padding:0 6px;border:1px solid;font-size:10px;letter-spacing:.1em}
.pill.won{color:var(--g)}.pill.lost{color:var(--r)}.pill.open{color:var(--o)}.pill.unknown{color:var(--u)}
.pos{color:var(--g)}.neg{color:var(--r)}
section#board{position:fixed;inset:5vh 4vw;background:var(--panel);backdrop-filter:blur(10px);border:1px solid #4a56b8;padding:18px;overflow:auto;z-index:6}
table{border-collapse:collapse;width:100%;margin-top:12px}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #2a3374;white-space:nowrap}th{color:var(--dim);font-weight:400;letter-spacing:.08em;position:sticky;top:0;background:#12113f}
td.note{white-space:normal;color:var(--dim);min-width:200px}


#legend{position:absolute;left:12px;bottom:74px;display:flex;gap:6px;flex-wrap:wrap}
#legend button{padding:5px 9px;font-size:11px;display:flex;align-items:center;gap:5px}
#legend b{display:inline-block;width:9px;height:9px;border:1px solid #fff3}
#legend i{font-style:normal;color:var(--dim)}
.livetab{color:#3aa8ff;border-color:#8a5a14}.livebtn{animation:pulse 1s infinite;box-shadow:0 0 14px #3aa8ff;border-color:#3aa8ff}
@keyframes pulse{50%{box-shadow:0 0 3px #3aa8ff}}
.w{background:var(--g)}.l{background:var(--r)}.o{background:var(--o)}.u{background:var(--u)}
.livetag{background:#3aa8ff;color:#02101f;font-weight:700;padding:0 5px;letter-spacing:.1em;font-size:10px}
.livelbl{position:fixed;pointer-events:none;transform:translate(-50%,-100%);padding:7px 10px;background:rgba(4,22,48,.82);border:1px solid #3aa8ff;box-shadow:0 0 18px rgba(58,168,255,.7);font-size:11px;white-space:nowrap;animation:pulse 1.2s infinite}
.pill.live{color:#3aa8ff}.tr.live{border-color:#3aa8ff;box-shadow:0 0 12px rgba(58,168,255,.5)}
.dim{color:var(--dim)}.score{margin-top:4px}.score.big{font-size:14px;margin:6px 0}.bet{margin-top:4px}

.c{background:#8a93b8}.pill.closed{color:#8a93b8}

.towin{margin-top:4px;color:#cfe9ff}.towin b{font-size:13px}

#stat{cursor:pointer}
#stat.min{font-size:0;padding:6px 10px}#stat.min b:first-child{font-size:13px}
@media(max-width:700px){
  header{padding:10px 12px 8px}h1{font-size:15px}.live{display:none}
  #stat{top:8px;right:8px;left:auto;max-width:62vw;font-size:10px;padding:6px 8px}
  #hint{display:none}
  #legend{left:8px;right:8px;bottom:64px;gap:4px}#legend button{padding:4px 7px;font-size:10px}
  #board-btn{right:8px;bottom:auto;top:calc(100% - 0px);display:none}
  #strip{left:6px;right:6px;bottom:6px}.day{flex:1 0 62px;min-width:62px;padding:3px 5px;font-size:10px}
  .livelbl{font-size:10px;padding:5px 7px}
  aside#panel{top:auto;height:62vh;width:100vw;border-left:0;border-top:1px solid #4a56b8}
  section#board{inset:2vh 2vw;padding:12px}
}
#mboard{display:none}
@media(max-width:700px){#mboard{display:inline-block;margin-left:8px}}
#stat.min b:not(:first-child){display:none}#stat.min:after{content:" realized · tap";font-size:9px;color:#7f8fc0}
</style>

</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <header>
    <h1>KALSHI CITY <span class="live"><i></i>LOCAL</span></h1>
    <div class="row">
      <select id="win" style="margin-right:0"><option value="1">1 DAY</option><option value="7" selected>1 WEEK</option><option value="30">1 MONTH</option><option value="9999">ALL</option></select>
      <select id="src" hidden><option value="all">ALL</option></select>
    </div>
  </header>
  <div id="stat"></div>
  <div id="hint">Drag to orbit · scroll/pinch to zoom · click a tower to go inside</div>
  <div id="strip"></div>
  <button id="board-btn">BOARD</button>
  <div id="legend"><button data-s="live" class="livetab">LIVE<i></i></button><button data-s="open"><b class="o"></b>open<i></i></button><button data-s="won"><b class="w"></b>won<i></i></button><button data-s="lost"><b class="l"></b>lost<i></i></button><button data-s="closed"><b class="c"></b>closed<i></i></button><button data-s="unknown"><b class="u"></b>unknown<i></i></button></div>
</div>
<div id="label"></div>
<aside id="panel" hidden><button id="close">×</button><div id="pbody"></div></aside>
<section id="board" hidden><button id="bclose">×</button><div id="bbody"></div></section>
